# Frontend (canonical, no www): rashikundali.com -> :3006
server {
    server_name rashikundali.com;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rashikundali.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rashikundali.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www -> redirect to apex (single canonical host)
server {
    server_name www.rashikundali.com;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rashikundali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rashikundali.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://rashikundali.com$request_uri;
}

# API: api.rashikundali.com -> :3460 (bare "/" bounces to the landing page)
server {
    server_name api.rashikundali.com;

    location = / {
        return 301 https://rashikundali.com;
    }

    location / {
        proxy_pass http://127.0.0.1:3460;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types application/json text/plain;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rashikundali.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rashikundali.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS (all hosts)
server {
    listen 80;
    listen [::]:80;
    server_name rashikundali.com www.rashikundali.com api.rashikundali.com;
    return 301 https://$host$request_uri;
}
