# Generated by nginx-setup.ts — kundaliweb.shrikundali.com -> :3006
server {
    listen 80;
    server_name kundaliweb.shrikundali.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kundaliweb.shrikundali.com;

    ssl_certificate     /etc/letsencrypt/live/kundaliweb.shrikundali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kundaliweb.shrikundali.com/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types application/json application/javascript text/plain text/css text/html;
}
