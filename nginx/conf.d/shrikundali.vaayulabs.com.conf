# Frontend: shrikundali.vaayulabs.com -> :3006
server {
    listen 80;
    listen [::]:80;
    server_name shrikundali.vaayulabs.com www.shrikundali.vaayulabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shrikundali.vaayulabs.com www.shrikundali.vaayulabs.com;

    ssl_certificate /etc/letsencrypt/live/shrikundali.vaayulabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shrikundali.vaayulabs.com/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript;
}

# API: kundaliapi.shrikundali.vaayulabs.com -> :3460
server {
    listen 80;
    listen [::]:80;
    server_name kundaliapi.shrikundali.vaayulabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kundaliapi.shrikundali.vaayulabs.com;

    ssl_certificate /etc/letsencrypt/live/shrikundali.vaayulabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shrikundali.vaayulabs.com/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3460;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types application/json text/plain;
}
