# Per-service compose. Joins the shared external vaayu_db network.
# Run:  docker compose -f compose.yaml up -d --build
name: vaayu-kundaliapi

services:
  kundaliapi:
    build:
      context: ../../..
      dockerfile: Dockerfile.backend
    image: kundaliapi:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/app_kundaliapi}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-false}
      MINIO_HOST: ${MINIO_HOST:-host.docker.internal}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_SSL: ${MINIO_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-shrikundali}
    ports:
      - "3460:3400"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [vaayu_db]

networks:
  vaayu_db:
    external: true
