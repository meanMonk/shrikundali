<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241E4E" />
      <stop offset="55%" stop-color="#B5451C" />
      <stop offset="100%" stop-color="#FBF6EF" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#F4E2A1" />
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="url(#bg)" />
  <!-- Kundali (birth chart) square with 12-house diamond grid -->
  <g transform="translate(480,320)" stroke="url(#gold)" stroke-width="3" fill="none" opacity="0.9">
    <rect x="-260" y="-260" width="520" height="520" />
    <path d="M -260 -260 L 260 260 M 260 -260 L -260 260" />
    <path d="M 0 -260 L -260 0 L 0 260 L 260 0 Z" />
  </g>
  <!-- orbiting stars -->
  <g fill="#C9A227">
    <circle cx="180" cy="80" r="4" />
    <circle cx="740" cy="150" r="3" />
    <circle cx="820" cy="470" r="5" />
    <circle cx="140" cy="520" r="3" />
    <circle cx="470" cy="60" r="3" />
    <circle cx="880" cy="300" r="4" />
    <circle cx="90" cy="300" r="3" />
  </g>
</svg>
