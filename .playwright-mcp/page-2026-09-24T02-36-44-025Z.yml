      - paragraph [ref=e475]: The following auspicious yogas are formed in your chart. They arise from planetary combinations and lend strength to specific areas of life.
      - generic [ref=e476]: Major Yogas
      - paragraph [ref=e477]: Raja Yoga — In this chart there is relationship between Mercury and Venus planets. A typical Raja Yoga happens when two or more than two planets (out of which atleast one should be the lord of 'Kendra' & the other should be the lord of 'Trikon') is in a relationship with each other. This relationship can be a combination, bidirectional vision or exchange of zodiacs. A person with a Raja Yoga enjoys social status and fame. Recognition and laurels will follow them for their efforts on various matters.
      - paragraph [ref=e478]: Bhadra Yoga — Bhadra Yoga is formed when Mercury is positioned in a Kendra that corresponds to his own sign or his exaltation sign. In this horoscope, Mercury is positioned in its own sign Mithuna in the Tenth house, giving rise to the formation of the Bhadra Yoga.
      - generic [ref=e479]: Chandra Yogas
      - paragraph [ref=e480]: Sunapha Yoga — When planets, excluding the Sun, are positioned in the second house from the Moon, Sunapha Yoga is formed. In this horoscope, second house from Moon is occupied Saturn, satisfying the conditions for the formation of Sunapha Yoga.
      - generic [ref=e481]: Inauspicious Yogas
      - paragraph [ref=e482]: Daridra Yoga — Daridra Yoga is formed when the lords of the 12th and Lagna exchange positions and are conjoined or aspected by the 7th lord. In this horoscope, Mercury, the lord of lagna, resides in Tenth house with malefic planets, Sun, Mercury and Ketu and is in conjunction with Venus, the lord of second house and Saturn, lord of fifth house, in conjunction with Saturn, the lord of sixth house without benefic association, indicating the formation of Daridra Yoga.
      - paragraph [ref=e483]: Grahan Yoga — Grahan Yoga is formed when the Sun or Moon is in conjunction with Rahu or Ketu in a birth chart. In this horoscope, Moon is in conjunction with Rahu and Sun is in conjunction with Ketu satisfies the condition for the formation of Grahan Yoga.
