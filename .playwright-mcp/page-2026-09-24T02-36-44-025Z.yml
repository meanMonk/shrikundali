      - generic [ref=e330]: Planet-wise reading
      - generic [ref=e331]:
        - paragraph [ref=e332]: Sun · Gemini · H3 — Sun represents the soul, father, authority and vitality and governs leadership, confidence, recognition and health. In the Third House (Sahaja Bhava) it activates courage, siblings, communication, short journeys and effort.
        - paragraph [ref=e333]: Moon · Sagittarius · H9 — Moon represents the mind, emotions, mother and nourishment and governs emotional balance, intuition, public life and comfort. In the Ninth House (Dharma Bhava) it activates fortune, dharma, higher learning, father and long journeys.
        - paragraph [ref=e334]: Mercury · Gemini · H3 — Mercury represents intelligence, speech, commerce and analysis and governs communication, trade, learning and calculation. In the Third House (Sahaja Bhava) it activates courage, siblings, communication, short journeys and effort. It sits in its own sign, giving it stability.
        - paragraph [ref=e335]: Venus · Gemini · H3 — Venus represents love, beauty, luxury and relationship and governs marriage, wealth, arts and comforts. In the Third House (Sahaja Bhava) it activates courage, siblings, communication, short journeys and effort.
        - paragraph [ref=e336]: Mars · Aries · H1 — Mars represents energy, courage, drive and competition and governs ambition, property, siblings and physical strength. In the First House (Tanu Bhava) it activates self, body, personality, vitality and overall life direction. It sits in its own sign, giving it stability.
        - paragraph [ref=e337]: Jupiter · Leo · H5 — Jupiter represents wisdom, expansion, fortune and dharma and governs wealth, children, higher knowledge and grace. In the Fifth House (Putra Bhava) it activates creativity, children, intelligence, speculation and romance.
        - paragraph [ref=e338]: Saturn · Capricorn · H10 — Saturn represents discipline, karma, patience and endurance and governs career, longevity, responsibility and delays. In the Tenth House (Karma Bhava) it activates career, authority, reputation, karma and public standing. It sits in its own sign, giving it stability. It is retrograde, so its results mature slowly and often after review.
        - paragraph [ref=e339]: Rahu · Sagittarius · H9 — Rahu represents ambition, illusion, obsession and sudden gains and governs foreign matters, technology, and unconventional paths. In the Ninth House (Dharma Bhava) it activates fortune, dharma, higher learning, father and long journeys.
        - paragraph [ref=e340]: Ketu · Gemini · H3 — Ketu represents detachment, spirituality, insight and moksha and governs liberation, research, and past-life karma. In the Third House (Sahaja Bhava) it activates courage, siblings, communication, short journeys and effort.
      - generic [ref=e341]: Degree and nakshatra together reveal a planet's real strength; the house is the life-area where it acts. Rahu/Ketu are always retrograde; (R) marks other retrograde planets.
